# OmniRoute on Hostless
# Uses the shared free allowance at its maximum: 0.5 vCPU / 1 GiB RAM.
# Keep one replica so SQLite remains single-writer and the disk stays attached.

build:
  command: ""
  system: docker
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 8192

dockerfile_path: Dockerfile
working_directory: /
post_build_command: ""

scaling:
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1

health_check:
  type: tcp
  interval_in_seconds: 10

cron_jobs: []
workers: []

review_apps:
  enabled: false
  ttl_days: 7
